<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcare Group BD - Document Assistant</title>
<style>
  :root {
    --bg: #f6faf9; --card: #ffffff; --line: #dbe7e4;
    --text: #1f2d2b; --muted: #6b7f7b;
    --accent: #2a9d8f; --accent-soft: #e3f4f1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; padding: 0 16px; }
  header { padding: 22px 0 14px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.3rem; margin: 0; font-weight: 650; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  select { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: .9rem; max-width: 100%; }
  #chat { flex: 1; overflow-y: auto; padding: 8px 0 16px; display: flex; flex-direction: column; gap: 12px; }
  .empty { margin: auto; color: var(--muted); text-align: center; font-size: .95rem; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bot.error { background: #fdf1f0; border-color: #f0c9c5; color: #8a2f27; }
  .msg.md { white-space: normal; }
  .md p { margin: 0 0 10px; } .md > :last-child { margin-bottom: 0; }
  .md h4 { margin: 12px 0 6px; font-size: 1rem; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; } .md li { margin: 3px 0; }
  .md code { background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; font-size: .9em; }
  .md table { border-collapse: collapse; margin: 0 0 10px; font-size: .9rem; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; } .md th { background: var(--accent-soft); }
  form { display: flex; gap: 8px; padding: 12px 0 20px; }
  input[type=text] { flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 12px 14px; font-size: 1rem; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 0 20px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1 id="company">Welcare Group BD</h1>
      <p>Ask a question about our documents</p>
    </div>
  </header>

  <div id="chat"><div class="empty" id="empty">Type your question below to get started.</div></div>

  <form id="form">
    <input type="text" id="q" placeholder="Ask a question" autocomplete="off" required>
    <button id="send" type="submit">Ask</button>
  </form>
</div>

<script>
const chat = document.getElementById("chat"), form = document.getElementById("form"),
      qInput = document.getElementById("q"), send = document.getElementById("send");

function md(src) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
  let html = "", list = null, para = [], table = [];
  const flushP = () => { if (para.length) { html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const closeList = () => { if (list) { html += "</" + list + ">"; list = null; } };
  const flushT = () => {
    if (!table.length) return;
    const rows = table.filter(r => !/^\|?[\s:|-]+\|?$/.test(r)).map(r => r.replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim())));
    html += "<table>" + rows.map((r, i) => "<tr>" + r.map(c => (i ? "<td>" : "<th>") + c + (i ? "</td>" : "</th>")).join("") + "</tr>").join("") + "</table>";
    table = [];
  };
  for (const raw of src.split("\n")) {
    const l = raw.trim(); let m;
    if (l.startsWith("|")) { flushP(); closeList(); table.push(l); continue; }
    flushT();
    if (!l) { flushP(); closeList(); continue; }
    if ((m = l.match(/^#{1,6}\s+(.*)/))) { flushP(); closeList(); html += "<h4>" + inline(m[1]) + "</h4>"; continue; }
    if ((m = l.match(/^[-*•]\s+(.*)/))) { flushP(); if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
    if ((m = l.match(/^\d+[.)]\s+(.*)/))) { flushP(); if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; } html += "<li>" + inline(m[1]) + "</li>"; continue; }
    closeList(); para.push(l);
  }
  flushP(); closeList(); flushT();
  return html;
}

function add(text, cls, rich) {
  document.getElementById("empty")?.remove();
  const d = document.createElement("div");
  d.className = "msg " + cls;
  if (rich) { d.innerHTML = md(text); d.classList.add("md"); } else { d.textContent = text; }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const question = qInput.value.trim();
  if (!question) return;
  add(question, "user");
  qInput.value = ""; send.disabled = true;
  const wait = add("Searching documents...", "bot");
  try {
    const res = await fetch("/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    wait.remove();
    if (!res.ok) add(data.detail || "Something went wrong. Please try again.", "bot error");
    else add(data.answer, "bot", true);
  } catch {
    wait.remove(); add("Could not reach the server. Check your connection and try again.", "bot error");
  }
  send.disabled = false; qInput.focus();
});

fetch("/config").then(r => r.json()).then(c => { document.getElementById("company").textContent = c.company; }).catch(() => {});
</script>
</body>
</html>
